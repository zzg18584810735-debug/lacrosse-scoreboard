# 测试环境配置

spring:
  # 测试环境数据库连接池
  datasource:
    hikari:
      # 测试环境特定配置
      maximum-pool-size: 15              # 测试环境连接池大小
      minimum-idle: 3                    # 测试环境最少空闲连接
      pool-name: EdusTestHikariCP

  data:
    redis:
      lettuce:
        pool:
          max-active: 15                 # 测试环境Redis连接池
          max-idle: 8
          min-idle: 1
log:
  path: /data/score-test/logs
  file:
    name: score-test
edus:
  auth:
    scoreboard-permit-all: true

  # 签名配置 - 生产环境
  sign:
    enabled: true
    app-id: edus-prod-open-api
    secret: change-me-sign-secret
    timestamp-expire-seconds: 300

  # 监控接口保护 - 测试环境
  monitor:
    access-token: change-me-monitor-token
    allow-dev-profile: false
    allow-internal-network: true
