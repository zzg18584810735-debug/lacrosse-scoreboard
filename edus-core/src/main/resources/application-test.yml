# 测试环境配置

spring:
  # 数据库配置 - 测试环境
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:edus_test}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      # 测试环境特定配置
      maximum-pool-size: 15              # 测试环境连接池大小
      minimum-idle: 3                    # 测试环境最少空闲连接
      pool-name: EdusTestHikariCP

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:1}
      lettuce:
        pool:
          max-active: 15                 # 测试环境Redis连接池
          max-idle: 8
          min-idle: 1
log:
  path: /data/test/logs
  file:
    name: edus-test
edus:
  # 签名配置 - 测试环境
  sign:
    enabled: true
    app-id: edus-test-open-api
    secret: edus-test-sign-secret
    timestamp-expire-seconds: 300

  # 监控接口保护 - 测试环境
  monitor:
    access-token: edus-test-monitor-token
    allow-dev-profile: true
    allow-internal-network: true
