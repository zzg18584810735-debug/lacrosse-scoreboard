spring:
  application:
    name: edus-core
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # 数据源配置 - 通用配置（环境特定配置在各profile文件中）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 通用连接池配置
      auto-commit: false                # 禁用自动提交
      allow-pool-suspension: false      # 禁用连接池挂起
      connection-test-query: SELECT 1  # 连接测试查询
      # 超时配置（通用）
      connection-timeout: 30000        # 连接超时（30秒）
      validation-timeout: 5000         # 验证超时（5秒）
      idle-timeout: 600000            # 空闲超时（10分钟）
      max-lifetime: 1800000           # 最大生命周期（30分钟）
      leak-detection-threshold: 60000 # 泄露检测（60秒）
      # 环境特定配置在各profile中覆盖：maximum-pool-size, minimum-idle, pool-name

  # Redis配置 - 通用配置（环境特定配置在各profile文件中）
  data:
    redis:
      timeout: 3000
      lettuce:
        pool:
          # 通用配置，具体数值在各profile中覆盖
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: -1

server:
  port: 8080
  servlet:
    context-path: /api

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.edus.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    # 性能优化配置
    cache-enabled: true                    # 启用二级缓存
    lazy-loading-enabled: true             # 启用懒加载
    aggressive-lazy-loading: false         # 禁用积极懒加载
    multiple-result-sets-enabled: true     # 允许多个结果集
    use-column-label: true                 # 使用列标签
    use-generated-keys: true               # 使用自动生成的主键
    default-executor-type: reuse           # 重用预处理语句
    default-statement-timeout: 30          # 查询超时时间（秒）
    default-fetch-size: 1000               # 默认获取大小
    default-ResultSet-type: forward_only   # 结果集类型
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    # 性能监控配置
    enable-sql-debug: true                 # 启用SQL调试
    sql-timeout-warning: 1000              # SQL超时警告阈值（毫秒）

edus:
  # 性能监控配置
  performance:
    monitoring:
      enabled: true
      slow-sql-threshold: 1000
      log-period: 100
      max-sql-length: 500

  # 异步任务通用配置，各环境可按需覆盖
  async:
    timeout-warning-millis: 30000

  # 监控接口通用安全基线，各环境在 profile 中明确覆盖
  monitor:
    access-token: "" # 请求头：X-Monitor-Token，各环境在 profile 中明确配置
    allow-dev-profile: false
    allow-internal-network: true
