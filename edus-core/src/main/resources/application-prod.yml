# 生产环境配置

spring:
  # 数据库配置 - 生产环境
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:edus_prod}?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      # 生产环境特定配置
      maximum-pool-size: 50              # 生产环境需要更多连接
      minimum-idle: 10                    # 保持更多空闲连接
      pool-name: EdusProdHikariCP

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:9}
      lettuce:
        pool:
          max-active: 50                 # 生产环境Redis连接池
          max-idle: 20
          min-idle: 5
log:
  path: /data/prod/logs
  file:
    name: edus-prod
edus:
  # 签名配置 - 生产环境
  sign:
    enabled: true
    app-id: edus-prod-open-api
    secret: change-me-sign-secret
    timestamp-expire-seconds: 300

  # 监控接口保护 - 生产环境
  monitor:
    access-token: change-me-monitor-token
    allow-dev-profile: false
    allow-internal-network: true
