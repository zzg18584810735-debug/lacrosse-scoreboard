# 开发环境配置

spring:
  # 开发环境数据库连接池
  datasource:
    hikari:
      # 开发环境特定配置
      maximum-pool-size: 10              # 开发环境连接池可以稍小
      minimum-idle: 2                    # 开发环境最少空闲连接
      pool-name: EdusDevHikariCP

  data:
    redis:
      lettuce:
        pool:
          max-active: 8                  # 开发环境Redis连接池
          max-idle: 8
          min-idle: 0

edus:
  # 开发阶段允许计分器接口免登录，后续接入记分员登录码时关闭。
  auth:
    scoreboard-permit-all: true

  # 签名配置 - 生产环境
  sign:
    enabled: true
    app-id: edus-prod-open-api
    secret: change-me-sign-secret
    timestamp-expire-seconds: 300

  # 监控接口保护 - 开发环境
  monitor:
    access-token: change-me-monitor-token
    allow-dev-profile: false
    allow-internal-network: true
