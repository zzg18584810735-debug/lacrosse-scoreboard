# 开发环境配置

spring:
  # 数据库配置 - 开发环境
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:demo}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      # 开发环境特定配置
      maximum-pool-size: 10              # 开发环境连接池可以稍小
      minimum-idle: 2                    # 开发环境最少空闲连接
      pool-name: EdusDevHikariCP

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      lettuce:
        pool:
          max-active: 8                  # 开发环境Redis连接池
          max-idle: 8
          min-idle: 0

edus:
  # 签名配置 - 开发环境
  sign:
    enabled: true
    app-id: jx-dev
    secret: edus-dev-sign-secret
    timestamp-expire-seconds: 300

  # 监控接口保护 - 开发环境
  monitor:
    access-token: edus-dev-monitor-token
    allow-dev-profile: true
    allow-internal-network: true
